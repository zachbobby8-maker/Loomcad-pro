<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom-CAD Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js for 3D Viewport -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls for interaction -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="overflow-hidden bg-[#050505] text-cyan-50 font-mono select-none">
  
  <!-- 3D Canvas Container -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full"></div>

  <!-- UI Overlay -->
  <div class="absolute inset-0 w-full h-full pointer-events-none flex flex-col justify-between p-4 md:p-8">
    
    <!-- Top HUD -->
    <header class="flex justify-between items-start">
      <div class="flex flex-col gap-1 backdrop-blur-md bg-black/40 p-4 border border-cyan-500/30 rounded-lg shadow-[0_0_15px_rgba(6,182,212,0.2)]">
        <h1 class="text-xl md:text-2xl font-bold tracking-widest text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]" data-i18n="app.title">LOOM-CAD PRO</h1>
        <div class="flex items-center gap-2 mt-1">
          <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_5px_#22d3ee]"></div>
          <p class="text-xs text-cyan-200/80 tracking-wider" id="status-hud">LATTICE-LOCK: SECURE | RESONANCE: 39,420 Hz</p>
        </div>
      </div>

      <!-- Token Costing -->
      <div class="flex flex-col items-end backdrop-blur-md bg-black/40 p-4 border border-purple-500/30 rounded-lg shadow-[0_0_15px_rgba(168,85,247,0.2)]">
        <p class="text-xs text-purple-300/80 tracking-widest mb-1" data-i18n="app.cost_label">MINT ESTIMATE</p>
        <div class="flex items-baseline gap-1">
          <span id="cost-value" class="text-3xl font-bold text-purple-400 drop-shadow-[0_0_8px_rgba(192,132,252,0.8)]">0</span>
          <span class="text-sm text-purple-300" data-i18n="app.cost_unit">$BRAID</span>
        </div>
      </div>
    </header>

    <!-- Bottom Command Bar -->
    <footer class="w-full max-w-4xl mx-auto pointer-events-auto">
      
      <!-- Console Output -->
      <div id="console-output" class="mb-4 text-sm md:text-base text-cyan-300/90 h-16 flex items-end drop-shadow-[0_0_5px_rgba(34,211,238,0.5)]">
        > <span id="console-text" class="ml-2 type-anim">System initialized. Waiting for Weaver intent...</span>
      </div>

      <!-- WEAVER_INPUT -->
      <div class="relative w-full backdrop-blur-xl bg-cyan-950/20 border border-cyan-500/50 rounded-xl p-2 md:p-3 shadow-[0_0_30px_rgba(6,182,212,0.15)] flex items-center gap-3 transition-all duration-300 focus-within:shadow-[0_0_40px_rgba(6,182,212,0.3)] focus-within:border-cyan-400">
        
        <!-- Animated Waveform (Simulated Voice) -->
        <div class="flex h-8 items-center gap-[2px] px-2 opacity-80" id="waveform">
          <div class="w-1 bg-cyan-400 h-2 wave-bar"></div>
          <div class="w-1 bg-cyan-400 h-5 wave-bar" style="animation-delay: 0.1s"></div>
          <div class="w-1 bg-cyan-400 h-3 wave-bar" style="animation-delay: 0.2s"></div>
          <div class="w-1 bg-cyan-400 h-6 wave-bar" style="animation-delay: 0.3s"></div>
          <div class="w-1 bg-cyan-400 h-4 wave-bar" style="animation-delay: 0.4s"></div>
        </div>

        <div class="text-xs text-cyan-500/80 uppercase tracking-widest whitespace-nowrap hidden md:block" data-i18n="app.console_label">
          WEAVER_INPUT // 5IR ENGINE
        </div>

        <input 
          type="text" 
          id="intent-input"
          class="flex-1 bg-transparent border-none outline-none text-cyan-50 placeholder:text-cyan-600/50 font-mono text-base md:text-lg px-2"
          autocomplete="off"
          spellcheck="false"
          data-i18n-placeholder="app.placeholder"
          placeholder="Enter Weaver Intent (e.g., 'mission CAD-008', 'braid', 'anchor')..."
        />
        
        <!-- Enter symbol -->
        <div class="w-8 h-8 flex items-center justify-center bg-cyan-900/40 rounded border border-cyan-800/50 text-cyan-500">
          ↵
        </div>
      </div>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
